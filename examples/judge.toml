# Three-judge panel used in the FinAutoRubric evaluation experiments.
# Each criterion passes with at least two passing votes.

[[judges]]
name = "or_muse_spark_medium"
model = "meta/muse-spark-1.3-contributor"
reasoning_effort = "medium"
max_tokens = 32768
max_retries = 4
request_timeout_seconds = 300
[judges.provider]
require_parameters = true

[[judges]]
name = "or_glm_flash_medium"
model = "z-ai/glm-5.3-flash"
reasoning_effort = "medium"
max_tokens = 32768
max_retries = 4
request_timeout_seconds = 300
[judges.provider]
require_parameters = true
quantizations = ["fp8", "bf16"]
ignore = ["phala"]

[[judges]]
name = "or_deepseek_v41_flash_medium"
model = "deepseek/deepseek-v4.1-flash"
reasoning_effort = "medium"
max_tokens = 32768
max_retries = 4
request_timeout_seconds = 300
[judges.provider]
require_parameters = true
quantizations = ["fp8", "bf16"]
